            // Maximum approximate number of characters per line
            // for green node labels.
            var GREEN_MAX_CHARS_PER_LINE = 20;


            // ============================================================
            // FUNCTION TO WRAP LONG LABELS
            // ============================================================

            function wrapLabel(text, maxChars) {

                if (!text) {
                    return text;
                }

                var words = text.split(/\s+/);
                var lines = [];
                var currentLine = "";

                words.forEach(function(word) {

                    var testLine;

                    if (currentLine === "") {
                        testLine = word;
                    } else {
                        testLine = currentLine + " " + word;
                    }

                    if (
                        currentLine !== "" &&
                        testLine.length > maxChars
                    ) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }

                });

                if (currentLine !== "") {
                    lines.push(currentLine);
                }

                return lines.join("\n");
            }


            // ============================================================

                            face: "Arial Bold",

                        };

                    }

                    // ----------------------------------------------------
                    // GREEN ORGANISATION NODES
                    // ----------------------------------------------------

                    else if (node.color === GREEN_COLOR) {

                        node.font = {
                            color: "black",
                            size: GREEN_FONT_SIZE,
                            multi: true
                        };

                        // Automatically insert line breaks into long
                        // organisation names.
                        node.label = wrapLabel(
                            node.label,
                            GREEN_MAX_CHARS_PER_LINE
                        );

                    }

                });

                return nodeData;
            }
