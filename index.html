        /*
         * ============================================================
         * PUBLICATION-QUALITY NETWORK FIGURE
         * ============================================================
         */

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .network-wrapper {
            width: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        /*
         * Larger canvas gives the physics engine room to separate
         * long labels and densely connected nodes.
         */
        #mynetwork {
            width: 100%;
            height: 1200px;
            background-color: #ffffff;
            border: none;
            position: relative;
            overflow: hidden;
        }

        /*
         * Small publication-style legend.
         */
        .network-legend {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 10;

            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #d7d7d7;
            border-radius: 5px;

            padding: 10px 14px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.7;

            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .legend-title {
            font-weight: 700;
            margin-bottom: 3px;
            color: #222222;
        }

        .legend-item {
            white-space: nowrap;
            color: #333333;
        }

        .legend-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: -1px;
        }

        .legend-category {
            background: #7A005E;
        }

        .legend-institution {
            background: #3D8664;
        }

        /*
         * Remove Bootstrap's card-like appearance from the figure.
         */
        .card {
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        .card-body {
            padding: 0 !important;
